<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Motorista - Transportadora</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-blue-600 text-white shadow-md py-4 px-6 text-center">
        <h1 class="text-xl font-bold">🚚 Transportadora - Painel do Motorista</h1>
    </header>

    <main class="max-w-xl mx-auto p-4 sm:p-6 w-full flex-grow">

        <!-- Seleção de Motorista -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 mb-6">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Motorista:</label>
            <select id="motorista-nome" class="w-full p-3 border rounded-xl bg-gray-50 text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">A carregar motoristas...</option>
            </select>
        </div>

        <!-- Abas de Navegação -->
        <div class="flex border-b border-gray-200 mb-6 bg-white rounded-xl shadow-sm overflow-hidden p-1">
            <button onclick="mudarAba('coleta')" id="btn-coleta" class="flex-1 py-3 text-sm font-bold rounded-lg transition bg-blue-600 text-white">📦 Coleta</button>
            <button onclick="mudarAba('abastecimento')" id="btn-abastecimento" class="flex-1 py-3 text-sm font-bold rounded-lg transition text-gray-600 hover:bg-gray-50">⛽ Abastecimento</button>
            <button onclick="mudarAba('manutencao')" id="btn-manutencao" class="flex-1 py-3 text-sm font-bold rounded-lg transition text-gray-600 hover:bg-gray-50">🔧 Manutenção</button>
        </div>

        <!-- Formulário: Coleta -->
        <div id="secao-coleta" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Plataforma *</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="selecionarPlataforma('Shopee')" id="plat-shopee" class="p-3 border-2 rounded-xl font-bold text-sm transition border-blue-600 bg-blue-50 text-blue-700">🛒 Shopee</button>
                    <button type="button" onclick="selecionarPlataforma('Mercado Livre')" id="plat-ml" class="p-3 border-2 rounded-xl font-bold text-sm transition border-gray-200 text-gray-600">📦 Mercado Livre</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Qtd. de Pacotes *</label>
                <input type="number" id="coleta-pacotes" placeholder="Ex: 120" class="w-full p-3 border rounded-xl bg-gray-50 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Foto / Comprovante de Coleta (Opcional)</label>
                <input type="file" id="foto-coleta" accept="image/*" class="w-full p-2.5 border rounded-xl bg-gray-50 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Observação (Opcional)</label>
                <textarea id="coleta-observacao" rows="2" placeholder="Ex: Pacotes avariados, observação da coleta..." class="w-full p-3 border rounded-xl bg-gray-50 text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <button onclick="salvarColeta()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3.5 rounded-xl shadow transition">Salvar Registro de Coleta</button>
        </div>

        <!-- Formulário: Abastecimento -->
        <div id="secao-abastecimento" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Valor do Abastecimento (R$) *</label>
                <input type="number" step="0.01" id="abast-valor" placeholder="Ex: 150.00" class="w-full p-3 border rounded-xl bg-gray-50 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Litros *</label>
                <input type="number" step="0.1" id="abast-litros" placeholder="Ex: 25.5" class="w-full p-3 border rounded-xl bg-gray-50 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Foto do Comprovante (Opcional)</label>
                <input type="file" id="foto-abast" accept="image/*" class="w-full p-2.5 border rounded-xl bg-gray-50 text-sm">
            </div>

            <button onclick="salvarAbastecimento()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3.5 rounded-xl shadow transition">Salvar Abastecimento</button>
        </div>

        <!-- Formulário: Manutenção -->
        <div id="secao-manutencao" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tipo de Serviço / Peça *</label>
                <input type="text" id="manut-servico" placeholder="Ex: Troca de Óleo, Pneus..." class="w-full p-3 border rounded-xl bg-gray-50 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Valor do Serviço (R$) *</label>
                <input type="number" step="0.01" id="manut-valor" placeholder="Ex: 250.00" class="w-full p-3 border rounded-xl bg-gray-50 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Quilometragem (KM) Atual *</label>
                <input type="number" id="manut-km" placeholder="Ex: 45000" class="w-full p-3 border rounded-xl bg-gray-50 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nota / Recibo (Opcional)</label>
                <input type="file" id="foto-manut" accept="image/*" class="w-full p-2.5 border rounded-xl bg-gray-50 text-sm">
            </div>

            <button onclick="salvarManutencao()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold p-3.5 rounded-xl shadow transition">Salvar Manutenção</button>
        </div>

    </main>

    <!-- Script Motorista -->
    <script>
        const SUPABASE_URL = 'https://tvnwulvpauexcpqhbqpb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8AWTXHRJX4gVjsTdMdO0Lw_gJGg5igQ';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let plataformaSelecionada = 'Shopee';

        async function carregarMotoristasSupabase() {
            const select = document.getElementById('motorista-nome');
            const { data, error } = await supabaseClient.from('motoristas').select('*').order('nome', { ascending: true });

            if (error || !data || data.length === 0) {
                console.error('Erro ao carregar motoristas:', error);
                select.innerHTML = '<option value="Motorista 01">Motorista 01</option>';
                return;
            }

            select.innerHTML = '';
            data.forEach(mot => {
                select.innerHTML += `<option value="${mot.nome}">${mot.nome} (${mot.veiculo})</option>`;
            });
        }

        function mudarAba(aba) {
            document.getElementById('secao-coleta').classList.add('hidden');
            document.getElementById('secao-abastecimento').classList.add('hidden');
            document.getElementById('secao-manutencao').classList.add('hidden');

            document.getElementById('btn-coleta').className = "flex-1 py-3 text-sm font-bold rounded-lg transition text-gray-600 hover:bg-gray-50";
            document.getElementById('btn-abastecimento').className = "flex-1 py-3 text-sm font-bold rounded-lg transition text-gray-600 hover:bg-gray-50";
            document.getElementById('btn-manutencao').className = "flex-1 py-3 text-sm font-bold rounded-lg transition text-gray-600 hover:bg-gray-50";

            if (aba === 'coleta') {
                document.getElementById('secao-coleta').classList.remove('hidden');
                document.getElementById('btn-coleta').className = "flex-1 py-3 text-sm font-bold rounded-lg transition bg-blue-600 text-white";
            } else if (aba === 'abastecimento') {
                document.getElementById('secao-abastecimento').classList.remove('hidden');
                document.getElementById('btn-abastecimento').className = "flex-1 py-3 text-sm font-bold rounded-lg transition bg-emerald-600 text-white";
            } else if (aba === 'manutencao') {
                document.getElementById('secao-manutencao').classList.remove('hidden');
                document.getElementById('btn-manutencao').className = "flex-1 py-3 text-sm font-bold rounded-lg transition bg-rose-600 text-white";
            }
        }

        function selecionarPlataforma(plat) {
            plataformaSelecionada = plat;
            if (plat === 'Shopee') {
                document.getElementById('plat-shopee').className = "p-3 border-2 rounded-xl font-bold text-sm transition border-blue-600 bg-blue-50 text-blue-700";
                document.getElementById('plat-ml').className = "p-3 border-2 rounded-xl font-bold text-sm transition border-gray-200 text-gray-600";
            } else {
                document.getElementById('plat-ml').className = "p-3 border-2 rounded-xl font-bold text-sm transition border-yellow-500 bg-yellow-50 text-yellow-700";
                document.getElementById('plat-shopee').className = "p-3 border-2 rounded-xl font-bold text-sm transition border-gray-200 text-gray-600";
            }
        }

        async function uploadFoto(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput.files || fileInput.files.length === 0) return null;

            const file = fileInput.files[0];
            const fileName = `${Date.now()}_${file.name}`;
            
            const { data, error } = await supabaseClient.storage.from('comprovantes').upload(fileName, file);
            if (error) {
                console.error('Erro no upload da foto:', error.message);
                return null;
            }

            const { data: publicURL } = supabaseClient.storage.from('comprovantes').getPublicUrl(fileName);
            return publicURL.publicUrl;
        }

        async function salvarColeta() {
            const motorista = document.getElementById('motorista-nome').value;
            const pacotes = parseInt(document.getElementById('coleta-pacotes').value);
            const observacao = document.getElementById('coleta-observacao').value;

            if (!pacotes || pacotes <= 0) {
                alert('Por favor, informe a quantidade de pacotes.');
                return;
            }

            const fotoUrl = await uploadFoto('foto-coleta');

            const { error } = await supabaseClient.from('registros').insert([{
                motorista: motorista,
                tipo: 'Coleta',
                plataforma: plataformaSelecionada,
                pacotes: pacotes,
                observacao: observacao,
                foto_comprovante: fotoUrl
            }]);

            if (error) {
                alert('Erro ao salvar coleta: ' + error.message);
            } else {
                alert('Coleta registada com sucesso!');
                document.getElementById('coleta-pacotes').value = '';
                document.getElementById('coleta-observacao').value = '';
                document.getElementById('foto-coleta').value = '';
            }
        }

        async function salvarAbastecimento() {
            const motorista = document.getElementById('motorista-nome').value;
            const valor = parseFloat(document.getElementById('abast-valor').value);
            const litros = parseFloat(document.getElementById('abast-litros').value);

            if (!valor || !litros) {
                alert('Preencha o valor e os litros.');
                return;
            }

            const fotoUrl = await uploadFoto('foto-abast');

            const { error } = await supabaseClient.from('registros').insert([{
                motorista: motorista,
                tipo: 'Abastecimento',
                valor_abastecimento: valor,
                litros: litros,
                foto_comprovante: fotoUrl
            }]);

            if (error) {
                alert('Erro ao salvar abastecimento: ' + error.message);
            } else {
                alert('Abastecimento registado com sucesso!');
                document.getElementById('abast-valor').value = '';
                document.getElementById('abast-litros').value = '';
                document.getElementById('foto-abast').value = '';
            }
        }

        async function salvarManutencao() {
            const motorista = document.getElementById('motorista-nome').value;
            const servico = document.getElementById('manut-servico').value;
            const valor = parseFloat(document.getElementById('manut-valor').value);
            const km = parseInt(document.getElementById('manut-km').value);

            if (!servico || !valor || !km) {
                alert('Preencha todos os campos obrigatórios da manutenção.');
                return;
            }

            const fotoUrl = await uploadFoto('foto-manut');

            const { error } = await supabaseClient.from('registros').insert([{
                motorista: motorista,
                tipo: 'Manutenção',
                observacao: servico,
                valor_abastecimento: valor,
                km: km,
                foto_comprovante: fotoUrl
            }]);

            if (error) {
                alert('Erro ao salvar manutenção: ' + error.message);
            } else {
                alert('Manutenção registada com sucesso!');
                document.getElementById('manut-servico').value = '';
                document.getElementById('manut-valor').value = '';
                document.getElementById('manut-km').value = '';
                document.getElementById('foto-manut').value = '';
            }
        }

        window.onload = carregarMotoristasSupabase;
    </script>
</body>
</html>
