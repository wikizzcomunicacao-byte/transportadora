<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorista - Gestão de Transportadora</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-12">

    <!-- Cabeçalho Principal -->
    <header class="bg-blue-600 text-white shadow-md py-4 px-6 text-center">
        <h1 class="text-xl font-bold flex items-center justify-center gap-2">🚚 Transportadora - Painel do Motorista</h1>
    </header>

    <main class="max-w-xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- Seleção do Motorista -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-4">
            <label for="select-motorista" class="font-semibold text-gray-700">Motorista:</label>
            <select id="select-motorista" class="w-full sm:w-72 p-2.5 border rounded-lg bg-gray-50 font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="Motorista 01">Motorista 01</option>
                <option value="Motorista 02">Motorista 02</option>
                <option value="Motorista 03">Motorista 03</option>
                <option value="Motorista 04">Motorista 04</option>
            </select>
        </div>

        <!-- Abas Estilo Cartão -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="flex border-b bg-gray-50">
                <button onclick="mudarAba('coleta')" id="tab-coleta" class="flex-1 py-4 px-4 text-center font-bold text-blue-600 border-b-2 border-blue-600 bg-white transition whitespace-nowrap">📦 1. Coleta</button>
                <button onclick="mudarAba('viagem')" id="tab-viagem" class="flex-1 py-4 px-4 text-center font-medium text-gray-500 hover:text-gray-700 transition whitespace-nowrap">⛽ 2. Viagem / Abast.</button>
            </div>

            <div class="p-6">
                <!-- ABA 1: COLETA -->
                <div id="conteudo-coleta" class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">PLATAFORMA *</label>
                        <div class="grid grid-cols-2 gap-4">
                            <button type="button" onclick="selecionarPlataforma('Shopee')" id="btn-shopee" class="p-3 border-2 border-orange-500 bg-orange-50 text-orange-600 font-bold rounded-xl flex items-center justify-center gap-2 transition shadow-sm">🟠 Shopee</button>
                            <button type="button" onclick="selecionarPlataforma('Mercado Livre')" id="btn-ml" class="p-3 border-2 border-gray-200 text-gray-600 font-bold rounded-xl flex items-center justify-center gap-2 transition hover:border-yellow-400">🤝 Mercado Livre</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">QTD. DE PACOTES *</label>
                        <input type="number" id="coleta-pacotes" min="1" placeholder="Ex: 120" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">📷 FOTO / COMPROVANTE DE COLETA (OPCIONAL)</label>
                        <input type="file" id="coleta-foto" accept="image/*" capture="environment" class="w-full p-2 border rounded-xl bg-gray-50 text-sm">
                    </div>

                    <button onclick="salvarColeta()" id="btn-salvar-coleta" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-lg">+ Salvar Registro de Coleta</button>
                </div>

                <!-- ABA 2: VIAGEM E ABASTECIMENTO -->
                <div id="conteudo-viagem" class="space-y-6 hidden">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">KM RODADO / ATUAL *</label>
                        <input type="number" id="viagem-km" min="0" placeholder="Ex: 145200" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">📷 FOTO DO PAINEL DO CAMIÃO (KM) (OPCIONAL)</label>
                        <input type="file" id="viagem-foto-km" accept="image/*" capture="environment" class="w-full p-2 border rounded-xl bg-gray-50 text-sm">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-4 border-t">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">VALOR ABASTECIMENTO (R$) (OPCIONAL)</label>
                            <input type="number" id="viagem-valor" step="0.01" min="0" placeholder="Ex: 250.00" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">LITROS (OPCIONAL)</label>
                            <input type="number" id="viagem-litros" step="0.1" min="0" placeholder="Ex: 45.5" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg font-semibold">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">🧾 FOTO DO COMPROVATIVO DE ABASTECIMENTO (OPCIONAL)</label>
                        <input type="file" id="viagem-foto-abast" accept="image/*" capture="environment" class="w-full p-2 border rounded-xl bg-gray-50 text-sm">
                    </div>

                    <button onclick="salvarViagemAbastecimento()" id="btn-salvar-viagem" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-lg">+ Salvar Viagem / Abastecimento</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Script de Lógica, Compressão de Foto e Supabase -->
    <script>
        const SUPABASE_URL = 'https://tvnwulvpauexcpqhbqpb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8AWTXHRJX4gVjsTdMdO0Lw_gJGg5igQ';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let plataformaSelecionada = 'Shopee';

        // Função para comprimir e redimensionar imagens no navegador
        function comprimirImagem(file, maxDimension = 1200, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDimension) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            }
                        } else {
                            if (height > maxDimension) {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        // Função de Upload de Foto Comprimida
        async function fazerUploadFoto(inputElement) {
            if (!inputElement || !inputElement.files || inputElement.files.length === 0) return null;
            
            const fileOriginal = inputElement.files[0];
            const fileComprimido = await comprimirImagem(fileOriginal);

            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.jpg`;
            const filePath = `fotos/${fileName}`;

            const { data, error } = await supabaseClient.storage.from('comprovantes').upload(filePath, fileComprimido, {
                contentType: 'image/jpeg'
            });

            if (error) {
                console.error("Erro no upload:", error);
                return null;
            }
            const { data: publicUrlData } = supabaseClient.storage.from('comprovantes').getPublicUrl(filePath);
            return publicUrlData.publicUrl;
        }

        function mudarAba(aba) {
            ['coleta', 'viagem'].forEach(a => {
                document.getElementById(`conteudo-${a}`).classList.add('hidden');
                document.getElementById(`tab-${a}`).className = "flex-1 py-4 px-4 text-center font-medium text-gray-500 hover:text-gray-700 transition whitespace-nowrap";
            });
            document.getElementById(`conteudo-${aba}`).classList.remove('hidden');
            document.getElementById(`tab-${aba}`).className = "flex-1 py-4 px-4 text-center font-bold text-blue-600 border-b-2 border-blue-600 bg-white transition whitespace-nowrap";
        }

        function selecionarPlataforma(plat) {
            plataformaSelecionada = plat;
            const btnShopee = document.getElementById('btn-shopee');
            const btnMl = document.getElementById('btn-ml');
            if (plat === 'Shopee') {
                btnShopee.className = "p-3 border-2 border-orange-500 bg-orange-50 text-orange-600 font-bold rounded-xl flex items-center justify-center gap-2 transition shadow-sm";
                btnMl.className = "p-3 border-2 border-gray-200 text-gray-600 font-bold rounded-xl flex items-center justify-center gap-2 transition hover:border-yellow-400";
            } else {
                btnMl.className = "p-3 border-2 border-yellow-500 bg-yellow-50 text-yellow-700 font-bold rounded-xl flex items-center justify-center gap-2 transition shadow-sm";
                btnShopee.className = "p-3 border-2 border-gray-200 text-gray-600 font-bold rounded-xl flex items-center justify-center gap-2 transition hover:border-orange-400";
            }
        }

        async function salvarColeta() {
            const motorista = document.getElementById('select-motorista').value;
            const pacotes = parseInt(document.getElementById('coleta-pacotes').value);
            const inputFoto = document.getElementById('coleta-foto');
            const btnSalvar = document.getElementById('btn-salvar-coleta');

            if (!pacotes || pacotes <= 0) {
                alert('Por favor, informe a quantidade de pacotes.');
                return;
            }

            btnSalvar.innerText = '⌛ Otimizando foto e salvando...';
            btnSalvar.disabled = true;

            const urlFoto = await fazerUploadFoto(inputFoto);

            const { error } = await supabaseClient.from('registros').insert([{
                motorista,
                tipo: 'Coleta',
                plataforma: plataformaSelecionada,
                pacotes,
                foto_comprovante: urlFoto,
                created_at: new Date().toISOString()
            }]);

            btnSalvar.innerText = '+ Salvar Registro de Coleta';
            btnSalvar.disabled = false;

            if (error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                alert('✅ Coleta registrada com sucesso!');
                document.getElementById('coleta-pacotes').value = '';
                inputFoto.value = '';
            }
        }

        async function salvarViagemAbastecimento() {
            const motorista = document.getElementById('select-motorista').value;
            const km = parseFloat(document.getElementById('viagem-km').value);
            const valor = parseFloat(document.getElementById('viagem-valor').value) || 0;
            const litros = parseFloat(document.getElementById('viagem-litros').value) || 0;
            
            const inputFotoKm = document.getElementById('viagem-foto-km');
            const inputFotoAbast = document.getElementById('viagem-foto-abast');
            const btnSalvar = document.getElementById('btn-salvar-viagem');

            if (isNaN(km) || km < 0) {
                alert('Por favor, informe o KM rodado / atual.');
                return;
            }

            btnSalvar.innerText = '⌛ Otimizando fotos e salvando...';
            btnSalvar.disabled = true;

            const urlFotoKm = await fazerUploadFoto(inputFotoKm);
            const urlFotoAbast = await fazerUploadFoto(inputFotoAbast);

            const registrosParaInserir = [{
                motorista,
                tipo: 'KM',
                km,
                foto_km: urlFotoKm,
                foto_comprovante: urlFotoKm,
                created_at: new Date().toISOString()
            }];

            if (valor > 0) {
                registrosParaInserir.push({
                    motorista,
                    tipo: 'Abastecimento',
                    valor_abastecimento: valor,
                    litros,
                    foto_abastecimento: urlFotoAbast,
                    foto_comprovante: urlFotoAbast,
                    created_at: new Date().toISOString()
                });
            }

            const { error } = await supabaseClient.from('registros').insert(registrosParaInserir);

            btnSalvar.innerText = '+ Salvar Viagem / Abastecimento';
            btnSalvar.disabled = false;

            if (error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                alert('✅ Viagem / Abastecimento registrados com sucesso!');
                document.getElementById('viagem-km').value = '';
                document.getElementById('viagem-valor').value = '';
                document.getElementById('viagem-litros').value = '';
                inputFotoKm.value = '';
                inputFotoAbast.value = '';
            }
        }
    </script>
</body>
</html>
