<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB Transportes - Login do Motorista</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .bg-gb-navy { background-color: #0d2847; }
        .text-gb-navy { color: #0d2847; }
        .bg-gb-orange { background-color: #f26522; }
        .border-gb-orange { border-color: #f26522; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- Topo / Cabeçalho -->
        <div class="bg-gb-navy p-6 text-center border-b-4 border-gb-orange flex flex-col items-center">
            <div class="bg-white p-3 rounded-2xl shadow-md mb-3">
                <!-- Logótipo GB Transportes -->
                <svg class="h-10 w-auto" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M70 30 L115 30 C135 30 145 40 145 52 C145 62 138 68 125 70 C140 73 148 82 148 95 C148 110 132 118 110 118 L65 118 L80 30 Z M92 50 L87 70 L110 70 C118 70 123 66 123 60 C123 54 118 50 110 50 L92 50 Z M83 85 L78 102 L112 102 C120 102 126 98 126 92 C126 86 120 85 112 85 L83 85 Z" fill="#0d2847"/>
                    <path d="M30 40 C50 15 100 15 130 30 L120 45 C98 32 60 32 45 50 C30 68 35 95 60 102 C80 107 110 100 125 85 L125 72 L90 72 L90 58 L142 58 L142 95 C118 118 75 122 42 112 C10 102 -5 70 30 40 Z" fill="#f26522"/>
                    <text x="160" y="75" font-family="Arial, sans-serif" font-weight="900" font-size="42" font-style="italic" fill="#58595b" letter-spacing="1">TRANSPORTES</text>
                    <text x="162" y="102" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#0d2847" letter-spacing="3">EFICIÊNCIA E AGILIDADE</text>
                    <line x1="420" y1="98" x2="470" y2="98" stroke="#f26522" stroke-width="4"/>
                </svg>
            </div>
            <h2 class="text-white font-black text-lg tracking-wide">ÁREA DO MOTORISTA</h2>
            <p class="text-orange-400 text-xs font-semibold uppercase">Digite seu nome e senha para acessar</p>
        </div>

        <!-- Formulário de Login -->
        <form onsubmit="fazerLogin(event)" class="p-6 space-y-4">
            
            <div id="mensagem-erro" class="hidden bg-red-50 text-red-600 p-3 rounded-xl text-xs font-bold border border-red-200">
                <!-- Erro inserido via JS -->
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nome do Motorista *</label>
                <input type="text" id="nome-motorista" required placeholder="Ex: EDUARDA, LEANDRO..." class="w-full p-3 border-2 border-gray-200 rounded-xl font-bold uppercase text-gray-800 text-sm outline-none focus:border-gb-navy transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Palavra-passe (Senha) *</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full p-3 border-2 border-gray-200 rounded-xl font-semibold text-gray-800 text-sm outline-none focus:border-gb-navy transition">
            </div>

            <button type="submit" id="btn-login" class="w-full bg-gb-orange hover:bg-orange-600 text-white font-black text-base py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2 transform active:scale-95">
                🔐 Entrar na Conta
            </button>
        </form>

        <div class="bg-gray-50 p-4 text-center border-t border-gray-100">
            <p class="text-xs text-gray-400 font-semibold">GB Transportes &copy; Todos os direitos reservados</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tvnwulvpauexcpqhbqpb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8AWTXHRJX4gVjsTdMdO0Lw_gJGg5igQ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Domínio interno para mapear nome -> e-mail no Supabase
        const DOMINIO_INTERNO = 'gbtransportes.com';

        async function verificarSessaoExistente() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
            }
        }

        async function fazerLogin(event) {
            event.preventDefault();
            
            const nomeInput = document.getElementById('nome-motorista').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const boxErro = document.getElementById('mensagem-erro');

            if (!nomeInput) return;

            // Remove espaços e acentos para formar o e-mail interno
            const nomeFormatado = nomeInput.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');
            const emailEquivalente = `${nomeFormatado}@${DOMINIO_INTERNO}`;

            boxErro.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = '⏳ A autenticar...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailEquivalente,
                password: password
            });

            if (error) {
                boxErro.innerText = 'Nome de motorista ou senha incorretos. Tente novamente.';
                boxErro.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = '🔐 Entrar na Conta';
            } else {
                window.location.href = 'index.html';
            }
        }

        window.onload = verificarSessaoExistente;
    </script>
</body>
</html>
