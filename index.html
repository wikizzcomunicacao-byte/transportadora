<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB Transportes - Painel do Motorista</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .bg-gb-navy { background-color: #0d2847; }
        .text-gb-navy { color: #0d2847; }
        .border-gb-navy { border-color: #0d2847; }
        .bg-gb-orange { background-color: #f26522; }
        .text-gb-orange { color: #f26522; }
        .border-gb-orange { border-color: #f26522; }
        
        .btn-tab-active {
            background-color: #0d2847 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 6px -1px rgba(13, 40, 71, 0.3);
        }
        
        .btn-shopee-active {
            background-color: #fff5f0 !important;
            border-color: #f26522 !important;
            color: #f26522 !important;
            box-shadow: 0 0 0 2px rgba(242, 101, 34, 0.2);
        }

        .btn-ml-active {
            background-color: #fffde6 !important;
            border-color: #eab308 !important;
            color: #854d0e !important;
            box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-12">

    <!-- Cabeçalho Principal -->
    <header class="bg-gb-navy text-white shadow-md py-4 px-4 flex flex-col sm:flex-row items-center justify-between gap-4 border-b-4 border-gb-orange">
        <div class="flex items-center gap-3">
            <div class="bg-white p-2.5 rounded-xl shadow-md">
                <!-- Logótipo GB Transportes -->
                <svg class="h-8 w-auto" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M70 30 L115 30 C135 30 145 40 145 52 C145 62 138 68 125 70 C140 73 148 82 148 95 C148 110 132 118 110 118 L65 118 L80 30 Z M92 50 L87 70 L110 70 C118 70 123 66 123 60 C123 54 118 50 110 50 L92 50 Z M83 85 L78 102 L112 102 C120 102 126 98 126 92 C126 86 120 85 112 85 L83 85 Z" fill="#0d2847"/>
                    <path d="M30 40 C50 15 100 15 130 30 L120 45 C98 32 60 32 45 50 C30 68 35 95 60 102 C80 107 110 100 125 85 L125 72 L90 72 L90 58 L142 58 L142 95 C118 118 75 122 42 112 C10 102 -5 70 30 40 Z" fill="#f26522"/>
                    <text x="160" y="75" font-family="Arial, sans-serif" font-weight="900" font-size="42" font-style="italic" fill="#58595b" letter-spacing="1">TRANSPORTES</text>
                    <text x="162" y="102" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#0d2847" letter-spacing="3">EFICIÊNCIA E AGILIDADE</text>
                    <line x1="420" y1="98" x2="470" y2="98" stroke="#f26522" stroke-width="4"/>
                </svg>
            </div>
            <div>
                <h1 class="text-sm font-black tracking-wide text-white">GB TRANSPORTES</h1>
                <p class="text-[10px] font-bold uppercase tracking-widest text-orange-400">Painel do Motorista</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <!-- Badge do Motorista Logado -->
            <div class="bg-white/10 px-3 py-1.5 rounded-xl border border-white/20 text-right">
                <span class="text-[10px] text-gray-300 font-bold uppercase block">Motorista Logado</span>
                <span id="nome-motorista-logado" class="text-xs font-black text-white uppercase">A carregar...</span>
            </div>
            <button onclick="fazerLogout()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-2 rounded-xl text-xs transition flex items-center gap-1 shadow">
                🚪 Sair
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Abas do Tipo de Lançamento -->
        <div class="grid grid-cols-3 gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-gray-200">
            <button id="tab-coleta" onclick="mudarAba('Coleta')" class="py-2.5 px-2 rounded-xl text-xs font-extrabold transition btn-tab-active flex items-center justify-center gap-1">
                📦 Coleta
            </button>
            <button id="tab-abastecer" onclick="mudarAba('Abastecimento')" class="py-2.5 px-2 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-100 transition flex items-center justify-center gap-1">
                ⛽ Abastecer
            </button>
            <button id="tab-manutencao" onclick="mudarAba('Manutenção')" class="py-2.5 px-2 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-100 transition flex items-center justify-center gap-1">
                🔧 Manutenção
            </button>
        </div>

        <!-- Formulário Dinâmico -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
            
            <!-- Campo de Plataforma (Apenas Coleta) -->
            <div id="campo-plataforma" class="space-y-1">
                <label class="block text-xs font-bold text-gray-500 uppercase">Plataforma *</label>
                <div class="grid grid-cols-2 gap-3 pt-1">
                    <button type="button" id="btn-shopee" onclick="selecionarPlataforma('Shopee')" class="p-3 border-2 rounded-xl font-extrabold text-sm transition btn-shopee-active flex items-center justify-center gap-2">
                        🛒 Shopee
                    </button>
                    <button type="button" id="btn-ml" onclick="selecionarPlataforma('Mercado Livre')" class="p-3 border-2 border-gray-200 rounded-xl font-bold text-gray-600 text-sm hover:bg-gray-50 transition flex items-center justify-center gap-2">
                        🤝 Mercado Livre
                    </button>
                </div>
            </div>

            <!-- Campo Quantidade de Pacotes (Coleta) -->
            <div id="campo-pacotes">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Qtd. de Pacotes *</label>
                <input type="number" id="input-pacotes" placeholder="Ex: 120" class="w-full p-3 border-2 border-gray-200 rounded-xl font-extrabold text-gray-800 text-lg outline-none focus:border-gb-navy transition">
            </div>

            <!-- Campo Valor Abastecimento/Manutenção -->
            <div id="campo-valor" class="hidden">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Valor Total (R$) *</label>
                <input type="number" step="0.01" id="input-valor" placeholder="Ex: 150.00" class="w-full p-3 border-2 border-gray-200 rounded-xl font-extrabold text-emerald-700 text-lg outline-none focus:border-emerald-600 transition">
            </div>

            <!-- Campo Litros (Abastecimento) -->
            <div id="campo-litros" class="hidden">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Litros *</label>
                <input type="number" step="0.01" id="input-litros" placeholder="Ex: 25.5" class="w-full p-3 border-2 border-gray-200 rounded-xl font-extrabold text-gray-800 text-lg outline-none focus:border-gb-navy transition">
            </div>

            <!-- Campo KM (Abastecimento e Manutenção) -->
            <div id="campo-km" class="hidden">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">KM Atual do Painel *</label>
                <input type="number" id="input-km" placeholder="Ex: 145000" class="w-full p-3 border-2 border-gray-200 rounded-xl font-extrabold text-amber-700 text-lg outline-none focus:border-amber-600 transition">
            </div>

            <!-- Campo Foto / Comprovante -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1" id="label-foto">Foto / Comprovante de Coleta (Opcional)</label>
                <input type="file" id="input-foto" accept="image/*" class="w-full text-sm text-gray-500 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-gray-100 file:text-gb-navy hover:file:bg-gray-200 transition cursor-pointer">
            </div>

            <!-- Campo Observação -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Observação (Opcional)</label>
                <textarea id="input-obs" rows="2" placeholder="Ex: Pacotes avariados, observação da coleta..." class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm font-medium outline-none focus:border-gb-navy transition resize-none"></textarea>
            </div>

            <!-- Botão Enviar principal -->
            <button id="btn-salvar" onclick="salvarRegistro()" class="w-full bg-gb-orange hover:bg-orange-600 text-white font-black text-base py-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 transform active:scale-95">
                💾 Salvar Registro de Coleta
            </button>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://tvnwulvpauexcpqhbqpb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8AWTXHRJX4gVjsTdMdO0Lw_gJGg5igQ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let abaAtual = 'Coleta';
        let plataformaAtual = 'Shopee';
        let motoristaLogadoNome = '';

        // 1. Verificar autenticação e identificar o nome do motorista logado
        async function verificarAutenticacao() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            // Extrai o nome do e-mail do Supabase (ex: eduarda@gbtransportes.com -> EDUARDA)
            const email = session.user.email || '';
            const usuarioEmail = email.split('@')[0];
            motoristaLogadoNome = usuarioEmail.toUpperCase();

            // Atualiza o indicador no cabeçalho
            document.getElementById('nome-motorista-logado').innerText = motoristaLogadoNome;
        }

        // 2. Função de Sair (Logout)
        async function fazerLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        function mudarAba(aba) {
            abaAtual = aba;

            ['coleta', 'abastecer', 'manutencao'].forEach(t => {
                document.getElementById(`tab-${t}`).className = 'py-2.5 px-2 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-100 transition flex items-center justify-center gap-1';
            });

            if (aba === 'Coleta') {
                document.getElementById('tab-coleta').className = 'py-2.5 px-2 rounded-xl text-xs font-extrabold transition btn-tab-active flex items-center justify-center gap-1';
            } else if (aba === 'Abastecimento') {
                document.getElementById('tab-abastecer').className = 'py-2.5 px-2 rounded-xl text-xs font-extrabold transition btn-tab-active flex items-center justify-center gap-1';
            } else if (aba === 'Manutenção') {
                document.getElementById('tab-manutencao').className = 'py-2.5 px-2 rounded-xl text-xs font-extrabold transition btn-tab-active flex items-center justify-center gap-1';
            }

            document.getElementById('campo-plataforma').style.display = aba === 'Coleta' ? 'block' : 'none';
            document.getElementById('campo-pacotes').style.display = aba === 'Coleta' ? 'block' : 'none';
            
            document.getElementById('campo-valor').style.display = (aba === 'Abastecimento' || aba === 'Manutenção') ? 'block' : 'none';
            document.getElementById('campo-litros').style.display = aba === 'Abastecimento' ? 'block' : 'none';
            document.getElementById('campo-km').style.display = (aba === 'Abastecimento' || aba === 'Manutenção') ? 'block' : 'none';

            const btnSalvar = document.getElementById('btn-salvar');
            const labelFoto = document.getElementById('label-foto');

            if (aba === 'Coleta') {
                btnSalvar.innerText = '💾 Salvar Registro de Coleta';
                labelFoto.innerText = 'Foto / Comprovante de Coleta (Opcional)';
            } else if (aba === 'Abastecimento') {
                btnSalvar.innerText = '⛽ Salvar Abastecimento';
                labelFoto.innerText = 'Foto do Comprovante / Noteira *';
            } else if (aba === 'Manutenção') {
                btnSalvar.innerText = '🔧 Salvar Manutenção';
                labelFoto.innerText = 'Foto da Nota / Recibo de Serviço *';
            }
        }

        function selecionarPlataforma(plat) {
            plataformaAtual = plat;
            const btnShopee = document.getElementById('btn-shopee');
            const btnMl = document.getElementById('btn-ml');

            if (plat === 'Shopee') {
                btnShopee.className = 'p-3 border-2 rounded-xl font-extrabold text-sm transition btn-shopee-active flex items-center justify-center gap-2';
                btnMl.className = 'p-3 border-2 border-gray-200 rounded-xl font-bold text-gray-600 text-sm hover:bg-gray-50 transition flex items-center justify-center gap-2';
            } else {
                btnShopee.className = 'p-3 border-2 border-gray-200 rounded-xl font-bold text-gray-600 text-sm hover:bg-gray-50 transition flex items-center justify-center gap-2';
                btnMl.className = 'p-3 border-2 rounded-xl font-extrabold text-sm transition btn-ml-active flex items-center justify-center gap-2';
            }
        }

        async function salvarRegistro() {
            if (!motoristaLogadoNome) {
                alert('Sessão inválida. Por favor, faça login novamente.');
                window.location.href = 'login.html';
                return;
            }

            const btnSalvar = document.getElementById('btn-salvar');
            btnSalvar.disabled = true;
            btnSalvar.innerText = '⏳ A gravar...';

            let fotoUrl = null;
            const fotoInput = document.getElementById('input-foto');

            if (fotoInput.files.length > 0) {
                const file = fotoInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

                const { data, error } = await supabaseClient.storage.from('comprovantes').upload(fileName, file);
                if (!error) {
                    const { data: publicData } = supabaseClient.storage.from('comprovantes').getPublicUrl(fileName);
                    fotoUrl = publicData.publicUrl;
                }
            }

            const registro = {
                motorista: motoristaLogadoNome,
                tipo: abaAtual,
                plataforma: abaAtual === 'Coleta' ? plataformaAtual : null,
                pacotes: abaAtual === 'Coleta' ? (parseInt(document.getElementById('input-pacotes').value) || 0) : 0,
                valor_abastecimento: (abaAtual === 'Abastecimento' || abaAtual === 'Manutenção') ? (parseFloat(document.getElementById('input-valor').value) || 0) : 0,
                litros: abaAtual === 'Abastecimento' ? (parseFloat(document.getElementById('input-litros').value) || 0) : 0,
                km: (abaAtual === 'Abastecimento' || abaAtual === 'Manutenção') ? (parseInt(document.getElementById('input-km').value) || null) : null,
                foto_comprovante: fotoUrl,
                observacao: document.getElementById('input-obs').value
            };

            const { error } = await supabaseClient.from('registros').insert([registro]);

            if (error) {
                alert('Erro ao guardar registo: ' + error.message);
            } else {
                alert('✅ Registo guardado com sucesso!');
                document.getElementById('input-pacotes').value = '';
                document.getElementById('input-valor').value = '';
                document.getElementById('input-litros').value = '';
                document.getElementById('input-km').value = '';
                document.getElementById('input-obs').value = '';
                document.getElementById('input-foto').value = '';
            }

            btnSalvar.disabled = false;
            mudarAba(abaAtual);
        }

        window.onload = verificarAutenticacao;
    </script>
</body>
</html>
