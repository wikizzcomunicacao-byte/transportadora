<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB Transportes - Painel do Motorista</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .bg-gb-navy { background-color: #0d2847; }
        .text-gb-navy { color: #0d2847; }
        .bg-gb-orange { background-color: #f26522; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 min-h-screen pb-12">

    <!-- Cabeçalho Principal com o Logótipo da GB Transportes -->
    <header class="bg-gb-navy text-white shadow-lg py-4 px-4 text-center border-b-4 border-orange-500">
        <div class="flex justify-center mb-2">
            <div class="bg-white px-3 py-1.5 rounded-xl shadow-sm">
                <svg class="h-9 w-auto" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M70 30 L115 30 C135 30 145 40 145 52 C145 62 138 68 125 70 C140 73 148 82 148 95 C148 110 132 118 110 118 L65 118 L80 30 Z M92 50 L87 70 L110 70 C118 70 123 66 123 60 C123 54 118 50 110 50 L92 50 Z M83 85 L78 102 L112 102 C120 102 126 98 126 92 C126 86 120 85 112 85 L83 85 Z" fill="#0d2847"/>
                    <path d="M30 40 C50 15 100 15 130 30 L120 45 C98 32 60 32 45 50 C30 68 35 95 60 102 C80 107 110 100 125 85 L125 72 L90 72 L90 58 L142 58 L142 95 C118 118 75 122 42 112 C10 102 -5 70 30 40 Z" fill="#f26522"/>
                    <text x="160" y="75" font-family="Arial, sans-serif" font-weight="900" font-size="42" font-style="italic" fill="#58595b" letter-spacing="1">TRANSPORTES</text>
                    <text x="162" y="102" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#0d2847" letter-spacing="3">EFICIÊNCIA E AGILIDADE</text>
                    <line x1="420" y1="98" x2="470" y2="98" stroke="#f26522" stroke-width="4"/>
                </svg>
            </div>
        </div>
        <h1 class="text-lg font-black tracking-wide">GB TRANSPORTES</h1>
        <p class="text-[11px] text-orange-400 font-semibold uppercase tracking-wider">Portal do Motorista</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Seleção de Motorista -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Selecione o seu Nome</label>
            <select id="select-motorista" class="w-full p-3 border rounded-xl bg-gray-50 text-base font-bold text-gb-navy outline-none focus:ring-2 focus:ring-orange-500">
                <!-- Carregado via JS -->
            </select>
        </div>

        <!-- Formulários de Registro -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tipo de Lançamento</label>
                <select id="tipo-lancamento" onchange="alternarCampos()" class="w-full p-3 border rounded-xl bg-gray-50 text-sm font-bold outline-none focus:ring-2 focus:ring-orange-500">
                    <option value="Coleta">📦 Registro de Coleta (Pacotes)</option>
                    <option value="Abastecimento">⛽ Registro de Abastecimento</option>
                    <option value="Manutenção">🔧 Registro de Manutenção</option>
                    <option value="KM">🚗 Registro de Quilometragem (KM)</option>
                </select>
            </div>

            <!-- Campo Coleta -->
            <div id="campo-coleta" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Plataforma</label>
                    <select id="plataforma" class="w-full p-3 border rounded-xl bg-gray-50 text-sm font-semibold outline-none focus:ring-2 focus:ring-orange-500">
                        <option value="Shopee">Shopee</option>
                        <option value="Mercado Livre">Mercado Livre</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Quantidade de Pacotes *</label>
                    <input type="number" id="pacotes" placeholder="Ex: 120" class="w-full p-3 border rounded-xl text-lg font-bold text-blue-600 outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>

            <!-- Campo Abastecimento -->
            <div id="campo-abastecimento" class="space-y-3 hidden">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Valor Total (R$) *</label>
                        <input type="number" step="0.01" id="valor-abastecimento" placeholder="Ex: 250.00" class="w-full p-3 border rounded-xl text-base font-bold text-emerald-600 outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Litros *</label>
                        <input type="number" step="0.01" id="litros" placeholder="Ex: 45.5" class="w-full p-3 border rounded-xl text-base font-bold text-emerald-600 outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                </div>
            </div>

            <!-- Campo Manutenção -->
            <div id="campo-manutencao" class="space-y-3 hidden">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Descrição do Serviço / Peça *</label>
                    <input type="text" id="servico-manutencao" placeholder="Ex: Troca de Óleo e Filtro" class="w-full p-3 border rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Valor do Serviço (R$) *</label>
                    <input type="number" step="0.01" id="valor-manutencao" placeholder="Ex: 180.00" class="w-full p-3 border rounded-xl text-base font-bold text-rose-600 outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>

            <!-- Campo KM (Comum a KM e Manutenção) -->
            <div id="campo-km" class="hidden">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">KM Atual do Odômetro *</label>
                <input type="number" id="km-atual" placeholder="Ex: 145800" class="w-full p-3 border rounded-xl text-base font-bold text-amber-600 outline-none focus:ring-2 focus:ring-orange-500">
            </div>

            <!-- Observação -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Observação (Opcional)</label>
                <input type="text" id="observacao" placeholder="Ex: Rota centro / Recibo anexado" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-500">
            </div>

            <!-- Upload da Foto/Comprovante -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Foto / Comprovativo (Opcional)</label>
                <input type="file" id="foto-input" accept="image/*" class="w-full p-2 border rounded-xl text-xs bg-gray-50 outline-none">
            </div>

            <button onclick="enviarRegistro()" id="btn-enviar" class="w-full bg-gb-orange hover:bg-orange-600 text-white font-black py-4 rounded-xl text-base shadow-lg transition">
                🚀 CONCLUIR E ENVIAR
            </button>
        </div>

    </main>

    <!-- Script Supabase Motorista -->
    <script>
        const SUPABASE_URL = 'https://tvnwulvpauexcpqhbqpb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8AWTXHRJX4gVjsTdMdO0Lw_gJGg5igQ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function carregarMotoristas() {
            const { data, error } = await supabaseClient.from('motoristas').select('nome').order('nome', { ascending: true });
            if (!error && data) {
                const select = document.getElementById('select-motorista');
                select.innerHTML = '';
                data.forEach(m => {
                    select.innerHTML += `<option value="${m.nome}">${m.nome}</option>`;
                });
            }
        }

        function alternarCampos() {
            const tipo = document.getElementById('tipo-lancamento').value;
            document.getElementById('campo-coleta').classList.toggle('hidden', tipo !== 'Coleta');
            document.getElementById('campo-abastecimento').classList.toggle('hidden', tipo !== 'Abastecimento');
            document.getElementById('campo-manutencao').classList.toggle('hidden', tipo !== 'Manutenção');
            document.getElementById('campo-km').classList.toggle('hidden', tipo !== 'KM' && tipo !== 'Manutenção');
        }

        async function enviarRegistro() {
            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerText = 'A enviar...';

            const motorista = document.getElementById('select-motorista').value;
            const tipo = document.getElementById('tipo-lancamento').value;
            const observacao = document.getElementById('observacao').value.trim();
            const fotoFile = document.getElementById('foto-input').files[0];

            let fotoUrl = null;

            if (fotoFile) {
                const fileExt = fotoFile.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                const { data: uploadData, error: uploadError } = await supabaseClient.storage.from('comprovantes').upload(fileName, fotoFile);

                if (!uploadError) {
                    const { data: urlData } = supabaseClient.storage.from('comprovantes').getPublicUrl(fileName);
                    fotoUrl = urlData.publicUrl;
                }
            }

            const registro = { motorista, tipo, observacao, foto_comprovante: fotoUrl };

            if (tipo === 'Coleta') {
                registro.plataforma = document.getElementById('plataforma').value;
                registro.pacotes = parseInt(document.getElementById('pacotes').value) || 0;
            } else if (tipo === 'Abastecimento') {
                registro.valor_abastecimento = parseFloat(document.getElementById('valor-abastecimento').value) || 0;
                registro.litros = parseFloat(document.getElementById('litros').value) || 0;
                registro.foto_abastecimento = fotoUrl;
            } else if (tipo === 'Manutenção') {
                registro.observacao = document.getElementById('servico-manutencao').value.trim() || observacao;
                registro.valor_abastecimento = parseFloat(document.getElementById('valor-manutencao').value) || 0;
                registro.km = parseInt(document.getElementById('km-atual').value) || null;
            } else if (tipo === 'KM') {
                registro.km = parseInt(document.getElementById('km-atual').value) || null;
                registro.foto_km = fotoUrl;
            }

            const { error } = await supabaseClient.from('registros').insert([registro]);

            btn.disabled = false;
            btn.innerText = '🚀 CONCLUIR E ENVIAR';

            if (error) {
                alert('Erro ao guardar o registo: ' + error.message);
            } else {
                alert('Registo enviado com sucesso!');
                document.getElementById('pacotes').value = '';
                document.getElementById('valor-abastecimento').value = '';
                document.getElementById('litros').value = '';
                document.getElementById('servico-manutencao').value = '';
                document.getElementById('valor-manutencao').value = '';
                document.getElementById('km-atual').value = '';
                document.getElementById('observacao').value = '';
                document.getElementById('foto-input').value = '';
            }
        }

        window.onload = carregarMotoristas;
    </script>
</body>
</html>
